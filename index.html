<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kanbanz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app"></div>

  <dialog id="dialog">
    <form id="dialog-form" method="dialog">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
      <div class="dialog-actions">
        <button type="button" class="btn-ghost danger" id="dialog-delete" hidden>Excluir</button>
        <span class="spacer"></span>
        <button type="button" class="btn-ghost" id="dialog-cancel">Cancelar</button>
        <button type="submit" class="btn-primary" id="dialog-submit">Salvar</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
